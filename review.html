<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Review copy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c70000'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <!-- A read-only copy of prototype pages, opened from a review link (review.html#<token>/<page path>).
       The copy is fetched with the site's public key and the token in the link. Reviewers can comment with their
       name when the link allows it; the only thing kept in this browser is that name, to fill it in next time. -->
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: #f3f2f1; color: #212529; font: 13.5px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    .bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 16px; background: #0e0c0c; color: #fff; }
    .badge { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 10px; background: #c70000; color: #fff; }
    .name { font-weight: 700; font-size: 1rem; }
    .meta { color: #bdb8b6; font-size: .85rem; }
    .spacer { flex: 1; }
    .nav { display: flex; align-items: center; gap: 6px; }
    .bar select, .bar button { font: inherit; border-radius: 6px; border: 1px solid #555; background: #1e1b1b; color: #fff; padding: 5px 8px; }
    .bar select { max-width: 50vw; }
    .bar button { cursor: pointer; padding: 5px 10px; }
    .bar button:disabled { opacity: .4; cursor: default; }
    .bar .primary { background: #c70000; border-color: #c70000; font-weight: 600; }
    .bar .primary[aria-pressed="true"] { background: #fff; color: #0e0c0c; border-color: #fff; }
    :focus-visible { outline: 3px solid #197ebe; outline-offset: 2px; }
    main { flex: 1; min-height: 0; display: flex; position: relative; }
    .stage { flex: 1; min-width: 0; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .msg { max-width: 560px; margin: 48px auto; padding: 20px 24px; background: #fff; border: 1px solid #d9d6d2; border-radius: 8px; }
    .msg h1 { font-size: 1.2rem; margin: 0 0 .5em; }
    .note { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: #0e0c0c; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: .9rem; max-width: 90%; z-index: 5; }
    .panel { flex: 0 0 360px; width: 360px; display: flex; flex-direction: column; background: #fff; border-left: 1px solid #d9d6d2; min-height: 0; }
    .panel__head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #d9d6d2; }
    .panel__head h2 { flex: 1; font-size: 1rem; margin: 0; }
    .panel__list { flex: 1; overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .panel__form { border-top: 1px solid #d9d6d2; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
    .panel label { font-weight: 600; font-size: .85rem; display: flex; flex-direction: column; gap: 3px; }
    .input { font: inherit; padding: 6px 8px; border: 1px solid #b9b5b1; border-radius: 6px; background: #fff; color: inherit; width: 100%; box-sizing: border-box; }
    textarea.input { resize: vertical; min-height: 70px; }
    .btn { font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: 1px solid #b9b5b1; background: #fff; color: #212529; cursor: pointer; }
    .btn--primary { background: #c70000; border-color: #c70000; color: #fff; }
    .btn--sm { padding: 3px 9px; font-size: .85rem; }
    .btn:disabled { opacity: .5; cursor: default; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .target { display: flex; align-items: center; gap: 6px; font-size: .85rem; }
    .target strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comment { border: 1px solid #d9d6d2; border-radius: 6px; padding: 8px 10px; }
    .comment.is-resolved { background: #f7f6f5; color: #555; }
    .comment__head { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
    .comment__body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
    .chip { display: inline-block; font: inherit; font-size: .75rem; color: #156265; background: #e3f0f1; border: 0; border-radius: 10px; padding: 1px 8px; margin-top: 4px; cursor: pointer; }
    .muted { color: #636363; } .small { font-size: .85rem; } .error { color: #b00020; font-weight: 600; }
    [hidden] { display: none !important; }
    .hide { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 760px) {
      .meta { display: none; } .bar { padding: 6px 10px; }
      main { flex-direction: column; }
      .panel { flex: 0 0 55%; width: auto; border-left: 0; border-top: 1px solid #d9d6d2; }
    }
  </style>
</head>
<body>
  <header class="bar" id="bar" hidden>
    <span class="badge">Review copy</span>
    <span class="name" id="name"></span>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <span class="nav" id="nav">
      <button type="button" id="prev" aria-label="Previous page">&#8249;</button>
      <label><span class="hide">Page</span><select id="page"></select></label>
      <button type="button" id="next" aria-label="Next page">&#8250;</button>
    </span>
    <button type="button" class="primary" id="toggle" aria-pressed="false" aria-controls="panel" hidden>Comments</button>
  </header>
  <main id="main"><div class="stage" id="stage"></div>
    <aside class="panel" id="panel" aria-label="Comments" hidden>
      <div class="panel__head"><h2 id="panel-title">Comments</h2><button type="button" class="btn btn--sm" id="close" aria-label="Close comments">Close</button></div>
      <div class="panel__list" id="list" aria-live="polite"></div>
      <form class="panel__form" id="form">
        <p class="small muted" style="margin:0">Your comments go to the team that made this prototype. Other people with this link can see them too.</p>
        <label>Your name<input class="input" id="who" type="text" maxlength="80" autocomplete="name" required></label>
        <div class="target"><span class="muted">About:</span><strong id="target">The whole page</strong><button type="button" class="btn btn--sm" id="pick">Pick a part</button><button type="button" class="btn btn--sm" id="clear" hidden aria-label="Comment on the whole page instead">&#10005;</button></div>
        <label>Comment<textarea class="input" id="body" maxlength="2000" required></textarea></label>
        <div class="row"><button type="submit" class="btn btn--primary" id="send">Send comment</button><span class="small" id="status" role="status"></span></div>
      </form>
    </aside>
  </main>

  <script src="assets/cms/svgs.js"></script>
  <script src="assets/cms/colour-tokens.js"></script>
  <script src="assets/cms/cloud-config.js"></script>
  <script>
    /* images in a review copy live in the public cms-shares bucket, in a folder named after the link's token */
    (function () {
      var m = /^#([0-9a-f]{64})/.exec(location.hash);
      var cfg = window.UOL_CLOUD_CONFIG || {};
      var base = String(cfg.url || '').trim().replace(/\/+$/, '') + '/storage/v1/object/public/cms-shares/' + (m ? m[1] : 'none') + '/';
      var REF = /media:(m[a-z0-9]+)/g;
      window.UOL_MEDIA = {
        keepRefs: false,
        replace: function (html) { return String(html).replace(REF, function (x, id) { return base + id; }); },
        resolve: function (v) { return typeof v === 'string' && v.indexOf('media:') === 0 ? base + v.slice(6) : v; },
        idOf: function (v) { return typeof v === 'string' && v.indexOf('media:') === 0 ? v.slice(6) : null; },
        get: function () { return null; }
      };
    })();
  </script>
  <script src="assets/cms/blocks.js"></script>
  <script src="assets/cms/render.js"></script>
  <script>
    (function () {
      'use strict';
      function $(id) { return document.getElementById(id); }
      var stage = $('stage'), bar = $('bar'), sel = $('page'), prev = $('prev'), next = $('next');
      var cfg = window.UOL_CLOUD_CONFIG || {}, url = String(cfg.url || '').trim().replace(/\/+$/, ''), key = String(cfg.anonKey || '').trim();
      var m = /^#([0-9a-f]{64})(?:\/(.*))?$/.exec(location.hash), token = m && m[1];
      var copy = null, frame = null, comments = [], target = null, picking = false, NAME_KEY = 'uol-review-name';
      var headers = { 'Content-Type': 'application/json', apikey: key };
      if (/^eyJ/.test(key)) headers.Authorization = 'Bearer ' + key;

      function rpc(name, args) {
        return fetch(url + '/rest/v1/rpc/' + name, { method: 'POST', headers: headers, body: JSON.stringify(args) }).then(function (r) {
          return r.text().then(function (t) { var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {} if (!r.ok) throw new Error((j && (j.message || j.msg)) || 'HTTP ' + r.status); return j; });
        });
      }
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      function message(title, text) {
        stage.innerHTML = '';
        var box = el('div', 'msg'); box.appendChild(el('h1', '', title)); box.appendChild(el('p', '', text)); stage.appendChild(box);
        document.title = title;
      }
      function note(text) { var n = el('div', 'note', text); n.setAttribute('role', 'status'); stage.appendChild(n); setTimeout(function () { n.remove(); }, 4000); }
      function fmt(iso) { var d = new Date(iso); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
      function slugOf(p) { return String(p.slug || '').replace(/^\/+|\/+$/g, ''); }
      function current() {
        var s = decodeURIComponent((/^#[0-9a-f]{64}\/(.*)$/.exec(location.hash) || [])[1] || '').replace(/^\/+|\/+$/g, '');
        var pages = copy.data.pages;
        return pages.filter(function (p) { return slugOf(p) === s; })[0] || pages.filter(function (p) { return p.template === 'homepage'; })[0] || pages[0];
      }
      /* a short description of a block, so the team knows which part a comment is about */
      function blockLabel(page, id) {
        var b = (page.blocks || []).filter(function (x) { return x.id === id; })[0]; if (!b) return '';
        var spec = window.UOL_BLOCKS.registry[b.type], text = '';
        Object.keys(b.props || {}).some(function (k) { var v = b.props[k]; if (typeof v === 'string' && /title|heading|text|html|quote|body|lead/i.test(k)) { text = v.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); return !!text; } return false; });
        return (spec ? spec.label : b.type) + (text ? ': ' + (text.length > 70 ? text.slice(0, 69) + '…' : text) : '');
      }

      /* ---------- the page ---------- */
      function show() {
        var d = copy.data, page = current();
        if (!page) { message('Nothing to show', 'This review copy has no pages.'); return; }
        var i = d.pages.indexOf(page);
        sel.value = String(i); prev.disabled = i <= 0; next.disabled = i >= d.pages.length - 1;
        document.title = page.title + ' | Review copy';
        setTarget(null); setPicking(false);
        frame.srcdoc = window.UOL_RENDER.renderDocument(d.site || {}, page, { pages: d.pages, sections: d.sections || [], markBlocks: !!copy.allow_comments });
        renderComments();
      }
      function go(i) { var p = copy.data.pages[i]; if (p) location.hash = '#' + token + '/' + slugOf(p); }
      function frameDoc() { try { return frame.contentDocument; } catch (e) { return null; } }
      /* hooks into the rendered page (same origin): picking a block, and pins on blocks with comments */
      function onFrameLoad() {
        var doc = frameDoc(); if (!doc || !copy.allow_comments) return;
        var st = doc.createElement('style');
        st.textContent = '.rv-hover{outline:2px dashed #c70000!important;outline-offset:-2px;cursor:crosshair!important}.rv-picked{outline:3px solid #c70000!important;outline-offset:-3px}' +
          '.rv-has{position:relative}.rv-pin{position:absolute;top:4px;right:4px;z-index:20;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#c70000;color:#fff;font:700 12px/22px Arial,sans-serif;text-align:center;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}' +
          'body.rv-picking a{cursor:crosshair!important}';
        doc.head.appendChild(st);
        doc.addEventListener('mouseover', function (e) { if (!picking) return; var b = e.target.closest('[data-block-id]'); doc.querySelectorAll('.rv-hover').forEach(function (n) { n.classList.remove('rv-hover'); }); if (b) b.classList.add('rv-hover'); });
        // on the window, so it runs before the page's own link handling and a pick never follows a link
        frame.contentWindow.addEventListener('click', function (e) {
          var pin = e.target.closest('.rv-pin');
          if (pin) { e.preventDefault(); e.stopPropagation(); openPanel(true); var c = $('list').querySelector('[data-block="' + pin.getAttribute('data-block') + '"]'); if (c) c.scrollIntoView({ block: 'nearest' }); return; }
          if (!picking) return;
          var b = e.target.closest('[data-block-id]');
          e.preventDefault(); e.stopPropagation();
          if (b) { setTarget(b.getAttribute('data-block-id')); setPicking(false); $('body').focus(); }
        }, true);
        doc.addEventListener('keydown', function (e) { if (e.key === 'Escape' && picking) setPicking(false); });
        markPins(); highlightTarget();
      }
      function markPins() {
        var doc = frameDoc(), page = copy && current(); if (!doc || !page) return;
        doc.querySelectorAll('.rv-pin').forEach(function (n) { n.remove(); });
        var count = {};
        comments.forEach(function (c) { if (c.page_id === page.id && c.block_id && !c.resolved_at) count[c.block_id] = (count[c.block_id] || 0) + 1; });
        Object.keys(count).forEach(function (id) {
          var b = doc.querySelector('[data-block-id="' + id + '"]'); if (!b) return;
          b.classList.add('rv-has');
          var pin = doc.createElement('button'); pin.type = 'button'; pin.className = 'rv-pin'; pin.setAttribute('data-block', id); pin.title = count[id] + ' comment' + (count[id] === 1 ? '' : 's'); pin.textContent = String(count[id]);
          b.appendChild(pin);
        });
      }
      function highlightTarget() {
        var doc = frameDoc(); if (!doc) return;
        doc.querySelectorAll('.rv-picked').forEach(function (n) { n.classList.remove('rv-picked'); });
        if (target) { var b = doc.querySelector('[data-block-id="' + target + '"]'); if (b) { b.classList.add('rv-picked'); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
      }

      /* ---------- comments ---------- */
      function setTarget(id) {
        target = id || null;
        var page = copy && current();
        $('target').textContent = target && page ? blockLabel(page, target) || 'Part of the page' : 'The whole page';
        $('clear').hidden = !target;
        highlightTarget();
      }
      function setPicking(on) {
        picking = !!on;
        $('pick').textContent = picking ? 'Click the page…' : 'Pick a part';
        var doc = frameDoc();
        if (doc && doc.body) { doc.body.classList.toggle('rv-picking', picking); if (!picking) doc.querySelectorAll('.rv-hover').forEach(function (n) { n.classList.remove('rv-hover'); }); }
        if (picking) note('Click the part of the page your comment is about. Esc cancels.');
      }
      function openPanel(on) { $('panel').hidden = !on; $('toggle').setAttribute('aria-pressed', on ? 'true' : 'false'); if (on && !$('who').value) $('who').focus(); }
      function renderComments() {
        var list = $('list'), page = copy && current(); if (!page) return;
        list.innerHTML = '';
        var mine = comments.filter(function (c) { return c.page_id === page.id; });
        var open = comments.filter(function (c) { return !c.resolved_at; }).length;
        $('toggle').textContent = 'Comments' + (open ? ' (' + open + ')' : '');
        $('panel-title').textContent = 'Comments on this page' + (mine.length ? ' (' + mine.length + ')' : '');
        if (!mine.length) list.appendChild(el('p', 'small muted', 'No comments on this page yet.'));
        mine.forEach(function (c) {
          var card = el('div', 'comment' + (c.resolved_at ? ' is-resolved' : ''));
          if (c.block_id) card.setAttribute('data-block', c.block_id);
          var head = el('div', 'comment__head'); head.appendChild(el('strong', '', c.guest_name)); head.appendChild(el('span', 'muted', fmt(c.created_at))); card.appendChild(head);
          if (c.block_id) { var chip = el('button', 'chip', c.block_label || 'Part of the page'); chip.type = 'button'; chip.addEventListener('click', function () { setTarget(c.block_id); }); card.appendChild(chip); }
          card.appendChild(el('div', 'comment__body', c.body));
          if (c.resolved_at) card.appendChild(el('div', 'small muted', 'Resolved by the team'));
          list.appendChild(card);
        });
        markPins();
      }
      function loadComments() {
        return rpc('guest_comment_list', { p_token: token }).then(function (rows) { comments = rows || []; renderComments(); }, function () {});
      }
      function send(e) {
        e.preventDefault();
        var name = $('who').value.trim(), body = $('body').value.trim(), status = $('status'), page = current();
        if (!name) { $('who').focus(); return; }
        if (!body) { $('body').focus(); return; }
        try { localStorage.setItem(NAME_KEY, name); } catch (err) {}
        $('send').disabled = true; status.className = 'small muted'; status.textContent = 'Sending…';
        rpc('add_guest_comment', { p_token: token, p_page: page.id, p_block: target, p_block_label: target ? blockLabel(page, target) : null, p_name: name, p_body: body }).then(function () {
          $('body').value = ''; setTarget(null); status.className = 'small'; status.textContent = 'Sent. Thank you.';
          return loadComments();
        }, function (err) { status.className = 'small error'; status.textContent = err.message; }).then(function () { $('send').disabled = false; });
      }

      /* ---------- start ---------- */
      if (!token) { message('This link is not complete', 'The address should end with a long code after the # sign. Copy the whole link from the message you were sent and try again.'); return; }
      if (!url || !key) { message('Review links are not set up here', 'This copy of the CMS is not connected to the cloud, so it cannot show review links.'); return; }
      message('Loading…', 'Fetching the review copy.');
      rpc('get_shared_project', { p_token: token }).then(function (rows) {
        copy = rows && rows[0];
        if (!copy || !copy.data || !Array.isArray(copy.data.pages)) { message('This review link does not work', 'It may have been deleted, or the address is incomplete. Ask the person who sent it for a new link.'); return; }
        var d = copy.data;
        stage.innerHTML = '';
        frame = document.createElement('iframe'); frame.title = 'Prototype page';
        frame.addEventListener('load', onFrameLoad);
        stage.appendChild(frame);
        $('name').textContent = copy.name;
        $('meta').textContent = 'Read only · copy from ' + fmt(copy.updated_at) + (d.madeBy ? ' · shared by ' + d.madeBy.replace(/@.*/, '') : '');
        sel.innerHTML = '';
        d.pages.forEach(function (p, i) { var o = el('option', '', p.title); o.value = String(i); sel.appendChild(o); });
        $('nav').hidden = d.pages.length < 2;
        bar.hidden = false;
        sel.addEventListener('change', function () { go(+sel.value); });
        prev.addEventListener('click', function () { go(+sel.value - 1); });
        next.addEventListener('click', function () { go(+sel.value + 1); });
        if (copy.allow_comments) {
          $('toggle').hidden = false;
          $('toggle').addEventListener('click', function () { openPanel($('panel').hidden); });
          $('close').addEventListener('click', function () { openPanel(false); });
          $('pick').addEventListener('click', function () { setPicking(!picking); });
          $('clear').addEventListener('click', function () { setTarget(null); });
          $('form').addEventListener('submit', send);
          try { $('who').value = localStorage.getItem(NAME_KEY) || ''; } catch (err) {}
          loadComments();
          setInterval(function () { if (!$('panel').hidden && document.visibilityState === 'visible') loadComments(); }, 60000);
        }
        // another review link pasted into this tab: start again with its copy
        window.addEventListener('hashchange', function () { if (location.hash.slice(1, 65) !== token) location.reload(); else show(); });
        // links between pages of the copy; links to pages outside it explain themselves
        window.addEventListener('message', function (e) {
          var msg = e.data || {};
          if (e.source !== frame.contentWindow || msg.uolcms !== 'navigate') return;
          if (picking) return;
          var t = d.pages.filter(function (p) { return slugOf(p) === String(msg.slug).replace(/^\/+|\/+$/g, ''); })[0];
          if (t) location.hash = '#' + token + '/' + slugOf(t);
          else note('That page is not part of this review copy.');
        });
        show();
      }).catch(function (e) { message('Could not load the review copy', 'Check your internet connection and reload the page. (' + e.message + ')'); });
    })();
  </script>
</body>
</html>
