<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .nopage { font-family: Segoe UI, system-ui, sans-serif; padding: 2rem; }
  </style>
</head>
<body>
  <script src="assets/cms/svgs.js"></script>
  <script src="assets/cms/colour-tokens.js"></script>
  <script src="assets/cms/media.js"></script>
  <script src="assets/cms/blocks.js"></script>
  <script src="assets/cms/render.js"></script>
  <script src="assets/cms/seed.js"></script>
  <script src="assets/cms/store.js"></script>
  <script>
    (function () {
      var Store = window.UOL_STORE;
      var frame = document.createElement('iframe');
      frame.title = 'Prototype page';
      document.body.appendChild(frame);
      function render() {
        if (!Store.data) { document.body.innerHTML = '<p class="nopage">No project is open. Open <a href="index.html">the CMS</a> and choose one.</p>'; return; }
        var slug = location.hash.replace(/^#\/?/, '') || (Store.data.pages[0] && Store.data.pages[0].slug);
        var page = Store.getPageBySlug(slug) || Store.data.pages[0];
        if (!page) { document.body.innerHTML = '<p class="nopage">No pages in the project. Open <a href="index.html">the CMS</a> to create one.</p>'; return; }
        document.title = page.title + ' | ' + (Store.data.site.name || 'University of Leeds');
        frame.srcdoc = window.UOL_RENDER.renderDocument(Store.data.site, page, { pages: Store.data.pages, sections: Store.data.sections });
      }
      window.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.uolcms === 'navigate') { location.hash = '#/' + d.slug; }
      });
      window.addEventListener('hashchange', render);
      // the project the CMS has open, from the browser's database; it reloads when the CMS saves
      var key = Store.openKey() || 'local';
      function load() { return Store.open(key).then(function (found) { if (!found && key === 'local') { var old = Store.legacy(); if (old) Store.data = old; } }); }
      try { new BroadcastChannel('leeds-cms').onmessage = function (e) { if (e.data && e.data.saved === key) load().then(render); }; } catch (e) {}
      window.UOL_MEDIA.open().then(load).then(render, render);
    })();
  </script>
</body>
</html>
